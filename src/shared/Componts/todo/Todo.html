<div class="todo-container">

  <div class="todo-card">

    <h1>My Todo List</h1>




    <!-- INPUT -->

    <div class="input-box">

      <input type="text" [(ngModel)]="todoTitle" placeholder="Enter todo..." />


      @if (editingId === null) {

      <button class="add" (click)="addTodo()">
        Add
      </button>

      } @else {

      <button class="update" (click)="updateTodo()">
        Update
      </button>

      <button class="cancel" (click)="cancelEdit()">
        Cancel
      </button>

      }

    </div>


    <!-- TODO LIST -->

    <div class="todo-list">

      @for (todo of todos(); track todo.id) {

      <div class="todo-item">

        <div class="todo-content">

          <input type="checkbox" [checked]="todo.completed" (change)="toggleTodo(todo.id)" />

          <span [class.completed]="todo.completed">

            {{ todo.title }}

          </span>

        </div>


        <div class="buttons">

          <button class="edit" (click)="editTodo(todo)">
            Edit
          </button>

          <button class="delete" (click)="deleteTodo(todo.id)">
            Delete
          </button>

        </div>

      </div>

      } @empty {


      }

    </div>

  </div>

</div>
